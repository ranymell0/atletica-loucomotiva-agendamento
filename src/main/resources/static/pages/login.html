<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Atlética Loucomotiva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<!-- Fundo vermelho escuro da atlética -->
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: #8B0000;">

<!-- Card principal dividido em dois lados -->
<div class="card" style="width: 100%; max-width: 850px; min-height: 450px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: row;">

    <!--logo da atlética -->
    <div class="d-flex flex-column align-items-center justify-content-center p-4" style="background-color: #1a1a1a; width: 50%;">
        <img src="../images/logo.png" alt="Atlética Loucomotiva" style="width: 220px;">
        <p class="text-white text-center mt-3" style="font-size: 0.8rem; color: #aaa !important;">Associação Atlética Acadêmica<br>UFOP João Monlevade</p>
    </div>

    <!-- formulário de login -->
    <div class="d-flex flex-column justify-content-center p-5" style="width: 50%;">

        <!-- Link para cadastro -->
        <div class="text-end mb-3">
            <small>Não tem conta? <a href="cadastro.html" class="link-atletica">Cadastre-se</a></small>
        </div>

        <h2 class="fw-bold mb-4" style="font-size: 2rem;">Agendamento<br>de Treinos</h2>

        <!-- Área para exibir mensagens de erro ou sucesso -->
        <div id="mensagem"></div>

        <!-- Campo de e-mail -->
        <div class="mb-3">
            <label class="form-label fw-bold">E-mail</label>
            <input type="email" id="email" class="form-control" placeholder="seu@email.com">
        </div>

        <!-- Campo de senha -->
        <div class="mb-4">
            <label class="form-label fw-bold">Senha</label>
            <input type="password" id="senha" class="form-control" placeholder="••••••••">
        </div>

        <!-- Botão de login -->
        <button onclick="login()" class="btn btn-atletica" style="width: 120px;">ENTRAR</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
