<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Atlética Loucomotiva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f5f5f5;">
<!-- Navbar - barra de navegação superior -->
<nav class="navbar navbar-expand-lg px-4 py-3">
    <a class="navbar-brand" href="dashboard.html">
        <img src="../images/logo.png" alt="Logo" style="width: 40px; margin-right: 8px;">
        LOUCOMOTIVA
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <!-- Nome do usuário logado com link para o perfil -->
        <a href="perfil.html" class="text-white text-decoration-none" id="nomeUsuario"></a>
        <!-- Botão para novo agendamento -->
        <a href="agendamento.html" class="btn btn-atletica btn-sm">+ Novo Agendamento</a>
        <!-- Botão de agenda semanal -->
        <a href="agenda-semanal.html" class="btn btn-outline-light btn-sm">Agenda Semanal</a>
        <!-- Botão de histórico -->
        <a href="historico.html" class="btn btn-outline-light btn-sm">Histórico</a>
        <!-- Botão de logout -->
        <a href="login.html" onclick="logout()" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
</nav>
<div class="container py-4">
    <!-- Mensagem de boas vindas -->
    <div class="card p-4 mb-4">
        <h4 class="fw-bold">Olá, <span id="nomeBoasVindas"></span>!</h4>
        <p class="text-muted mb-0">Confira seus agendamentos e reserve seu horário de treino.</p>
    </div>
    <!-- Cards de resumo dos agendamentos -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2 class="fw-bold" id="totalAgendamentos" style="color: #8B0000;">0</h2>
                <p class="text-muted mb-0">Total de Agendamentos</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2 class="fw-bold" id="agendamentosPendentes" style="color: #f0ad4e;">0</h2>
                <p class="text-muted mb-0">Pendentes</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2 class="fw-bold" id="agendamentosConfirmados" style="color: #5cb85c;">0</h2>
                <p class="text-muted mb-0">Confirmados</p>
            </div>
        </div>
    </div>
    <!-- Tabela de agendamentos do usuário -->
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Meus Agendamentos</h5>
            <a href="agendamento.html" class="btn btn-atletica btn-sm">+ Novo</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Esporte</th>
                    <th>Espaço</th>
                    <th>Status</th>
                </tr>
                </thead>
                <!-- Preenchida dinamicamente pelo dashboard.js -->
                <tbody id="tabelaAgendamentos">
                <tr>
                    <td colspan="5" class="text-center text-muted">Nenhum agendamento encontrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
