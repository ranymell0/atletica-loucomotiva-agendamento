# Configuração usada apenas durante os testes de componente/integração
spring.datasource.url=jdbc:postgresql://localhost:5432/agendamento_test
spring.datasource.username=${DB_TEST_USER:atletica_user}
spring.datasource.password=${DB_TEST_PASSWORD}

# Recria o schema do zero a cada execução de teste
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false