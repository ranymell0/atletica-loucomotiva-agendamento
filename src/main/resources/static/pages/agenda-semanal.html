<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Semanal - Atlética Loucomotiva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f5f5f5;">

<!-- Navbar - barra de navegação superior -->
<nav class="navbar navbar-expand-lg px-4 py-3">
    <a class="navbar-brand" href="dashboard.html">
        <img src="../images/logo.png" alt="Logo" style="width: 40px; margin-right: 8px;">
        LOUCOMOTIVA
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <!-- Nome do usuário logado com link para o perfil -->
        <a href="perfil.html" class="text-white text-decoration-none" id="nomeUsuario"></a>
        <!-- Botão para novo agendamento -->
        <a href="agendamento.html" class="btn btn-atletica btn-sm">+ Novo Agendamento</a>
        <!-- Botão de histórico -->
        <a href="historico.html" class="btn btn-outline-light btn-sm">Histórico</a>
        <!-- Botão de logout -->
        <a href="login.html" onclick="logout()" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
</nav>

<div class="container py-4">

    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="dashboard.html" class="text-muted text-decoration-none">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
            <h4 class="fw-bold mb-0 mt-1">Agenda Semanal</h4>
            <p class="text-muted mb-0" id="intervaloSemana"></p>
        </div>
        <!-- Navegação entre semanas -->
        <div class="d-flex gap-2">
            <button onclick="semanaAnterior()" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-chevron-left"></i> Semana anterior
            </button>
            <button onclick="semanaAtual()" class="btn btn-outline-secondary btn-sm">Hoje</button>
            <button onclick="proximaSemana()" class="btn btn-outline-secondary btn-sm">
                Próxima semana <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Lista de agendamentos agrupados por dia, preenchida dinamicamente pelo agenda-semanal.js -->
    <div id="listaDias"></div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script da agenda semanal -->
<script src="../js/agenda-semanal.js"></script>
</body>
</html>
