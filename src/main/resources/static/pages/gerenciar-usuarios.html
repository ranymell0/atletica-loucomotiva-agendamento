<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - Atlética Loucomotiva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f5f5f5;">

<!-- Navbar - barra de navegação superior -->
<nav class="navbar navbar-expand-lg px-4 py-3">
    <a class="navbar-brand" href="dashboard-admin.html">
        <img src="../images/logo.png" alt="Logo" style="width: 40px; margin-right: 8px;">
        LOUCOMOTIVA
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <!-- Nome do usuário logado -->
        <span class="text-white" id="nomeUsuario"></span>
        <!-- Badge indicando perfil admin -->
        <span class="badge bg-danger">ADMIN</span>
        <!-- Botão de logout -->
        <a href="login.html" onclick="logout()" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
</nav>

<div class="container py-4">

    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="dashboard-admin.html" class="text-muted text-decoration-none">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
            <h4 class="fw-bold mb-0 mt-1">Gerenciar Usuários</h4>
        </div>
    </div>

    <!-- Tabela de usuários cadastrados -->
    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <!-- Preenchida dinamicamente pelo gerenciar-usuarios.js -->
                <tbody id="tabelaUsuarios">
                <tr>
                    <td colspan="4" class="text-center text-muted">Nenhum usuário cadastrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal de confirmação de exclusão -->
<div class="modal fade" id="modalExcluir" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Mensagem de confirmação -->
                <p>Deseja realmente excluir o usuário <strong id="nomeExcluir"></strong>?</p>
                <p class="text-muted">Esta ação não pode ser desfeita.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <!-- Botão de confirmar exclusão -->
                <button onclick="confirmarExclusao()" class="btn btn-danger">Excluir</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/gerenciar-usuarios.js"></script>
</body>
</html>
