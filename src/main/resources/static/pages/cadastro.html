<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Atlética Loucomotiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: #8B0000;">

<div class="card" style="width: 100%; max-width: 850px; min-height: 450px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: row;">

    <!-- Lado esquerdo — Logo -->
    <div class="d-flex flex-column align-items-center justify-content-center p-4" style="background-color: #1a1a1a; width: 50%;">
        <img src="../images/logo.png" alt="Atlética Loucomotiva" style="width: 220px;">
        <p class="text-white text-center mt-3" style="font-size: 0.8rem; color: #aaa !important;">Associação Atlética Acadêmica<br>UFOP João Monlevade</p>
    </div>

    <!-- Lado direito — Formulário -->
    <div class="d-flex flex-column justify-content-center p-5" style="width: 50%;">
        <div class="text-end mb-3">
            <small>Já tem conta? <a href="login.html" class="link-atletica">Entrar</a></small>
        </div>

        <h2 class="fw-bold mb-4" style="font-size: 2rem;">Cadastro</h2>

        <div id="mensagem"></div>

        <div class="mb-3">
            <label class="form-label fw-bold">Nome</label>
            <input type="text" id="nome" class="form-control" placeholder="Seu nome completo">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">E-mail</label>
            <input type="email" id="email" class="form-control" placeholder="seu@email.com">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Senha</label>
            <input type="password" id="senha" class="form-control" placeholder="••••••••">
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Código de Administrador <span class="text-muted fw-normal">(opcional)</span></label>
            <input type="password" id="codigoAdmin" class="form-control" placeholder="Deixe em branco se for atleta">
        </div>

        <button onclick="cadastrar()" class="btn btn-atletica" style="width: 140px;">CADASTRAR</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/cadastro.js"></script>
</body>
</html>
