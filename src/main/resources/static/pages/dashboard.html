<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Atlética Loucomotiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f5f5f5;">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-4 py-3">
    <a class="navbar-brand" href="dashboard.html">
        <img src="../images/logo.png" alt="Logo" style="width: 40px; margin-right: 8px;">
        LOUCOMOTIVA
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white" id="nomeUsuario"></span>
        <a href="agendamento.html" class="btn btn-atletica btn-sm">+ Novo Agendamento</a>
        <a href="login.html" onclick="logout()" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
</nav>

<!-- Conteúdo -->
<div class="container py-4">

    <!-- Boas vindas -->
    <div class="card p-4 mb-4">
        <h4 class="fw-bold">Olá, <span id="nomeBoasVindas"></span>! 👋</h4>
        <p class="text-muted mb-0">Confira seus agendamentos e reserve seu horário de treino.</p>
    </div>

    <!-- Cards de resumo -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2 class="fw-bold" id="totalAgendamentos" style="color: #8B0000;">0</h2>
                <p class="text-muted mb-0">Total de Agendamentos</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2 class="fw-bold" id="agendamentosPendentes" style="color: #f0ad4e;">0</h2>
                <p class="text-muted mb-0">Pendentes</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2 class="fw-bold" id="agendamentosConfirmados" style="color: #5cb85c;">0</h2>
                <p class="text-muted mb-0">Confirmados</p>
            </div>
        </div>
    </div>

    <!-- Tabela de agendamentos -->
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Meus Agendamentos</h5>
            <a href="agendamento.html" class="btn btn-atletica btn-sm">+ Novo</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Esporte</th>
                    <th>Espaço</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="tabelaAgendamentos">
                <tr>
                    <td colspan="5" class="text-center text-muted">Nenhum agendamento encontrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
